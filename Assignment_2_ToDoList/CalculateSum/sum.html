<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg p-4" style="width: 400px;">
            <h2 class="text-center mb-4">Sum Calculator</h2>

            <div class="mb-3">
                <label for="num1" class="form-label">First Number</label>
                <input
                    type="number"
                    id="num1"
                    class="form-control"
                    placeholder="Enter first number">
            </div>

            <div class="mb-3">
                <label for="num2" class="form-label">Second Number</label>
                <input
                    type="number"
                    id="num2"
                    class="form-control"
                    placeholder="Enter second number">
            </div>

            <button id="sumBtn" class="btn btn-primary w-100">
                Calculate Sum
            </button>

            <div class="alert alert-success text-center mt-4">
                <h5 class="mb-0">
                    Result: <span id="result">0</span>
                </h5>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- External JavaScript -->
    <script src="sum.js"></script>

</body>
</html>
